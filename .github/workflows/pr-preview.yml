name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    name: Publish preview link
    runs-on: ubuntu-latest
    steps:
      - name: Add or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- attendance-pr-preview -->';
            const pr = context.payload.pull_request;
            const [owner, repo] = pr.head.repo.full_name.split('/');
            const sha = pr.head.sha;
            const shortSha = sha.slice(0, 7);
            const previewUrl = `https://rawcdn.githack.com/${owner}/${repo}/${sha}/index.html`;

            const body = `${marker}
            ## 🔎 PR Preview

            [**Open live preview →**](${previewUrl})

            Preview is pinned to commit \`${shortSha}\`, so it always matches the code currently shown in this PR.

            > The preview service may show a one-time confirmation page before opening HTML. Production continues to deploy separately through GitHub Pages after merge.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            core.summary
              .addHeading('PR Preview')
              .addLink('Open live preview', previewUrl)
              .addCodeBlock(sha)
              .write();
