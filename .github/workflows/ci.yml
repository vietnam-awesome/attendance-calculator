name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Test attendance rules
        run: npm test

  browser-smoke:
    if: github.event_name == 'pull_request'
    # Pin a Playwright-supported OS: ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "USE_SYSTEM_CHROME=1" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install chromium
          fi

      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/attendance-http.log 2>&1 &
          sleep 2

      - name: Verify desktop and mobile layout
        run: node scripts/ui-smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-browser-smoke
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
